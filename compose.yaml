services:
  db2:
    image: icr.io/db2_community/db2:11.5.9.0
    privileged: true
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?Copy .env.example to .env and set DB2_PASSWORD}
      DBNAME: ${DB2_DATABASE:-TESTDB}
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
    ports:
      - "127.0.0.1:${DB2_PORT:-50000}:50000"
    volumes:
      - db2data:/database
    healthcheck:
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to ${DB2_DATABASE:-TESTDB}' >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  db2data:
